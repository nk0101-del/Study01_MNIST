<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식기</title>
<link rel="stylesheet" href="스타일.css">
</head>
<body>
<main>
  <p class="작성자">2601919 김나경</p>
  <h1>손글씨 숫자 인식기</h1>
  <p class="안내">검은 칠판에 숫자를 하나 크게 그려 주세요.</p>

  <canvas id="그림판" width="280" height="280"></canvas>

  <p id="결과">인식 결과: -</p>
  <p id="후보">후보: -</p>

  <div class="버튼줄">
    <button id="인식버튼" type="button">인식하기</button>
    <button id="지우기버튼" type="button">지우기</button>
  </div>

  <p id="알림" class="알림" hidden></p>
</main>

<noscript>
  <p class="알림">이 페이지는 자바스크립트가 있어야 동작합니다.</p>
</noscript>

<script type="module" src="앱.js"></script>
<script>
// ES 모듈은 file:// 에서 CORS 로 차단되어 조용히 멈춘다.
// 그 경우 원인을 화면에 드러낸다.
if (location.protocol === "file:") {
  var 알림 = document.getElementById("알림");
  알림.hidden = false;
  알림.textContent =
    "이 페이지는 파일을 직접 열면 동작하지 않습니다. " +
    "web_version 폴더에서 'python -m http.server 8000' 을 실행한 뒤 " +
    "http://localhost:8000/ 으로 열어 주세요.";
}
</script>
</body>
</html>
